name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Offline end-to-end update (synthetic prices, no network, README untouched)
        run: python -m stocklab update --source synthetic --out reports/synthetic --readme reports/synthetic/README_preview.md --n-sims 300 --n-boot 200
      - name: Offline pre-market check (synthetic prices)
        run: python -m stocklab premarket --source synthetic --out reports/synthetic --readme reports/synthetic/README_preview.md --n-boot 200
      - name: Offline live board, one refresh (synthetic prices)
        run: python -m stocklab live --source synthetic --once --out reports/synthetic
