name: daily-update

# Refreshes prices, the decision board, the full report, the signal log and the README's
# live section after every US trading day. It can also be started by hand from the
# Actions tab ("Run workflow").

on:
  schedule:
    # 22:17 UTC on weekdays: after the US close (16:00 New York) in both summer and winter time.
    # GitHub may start scheduled runs a little late at busy times.
    - cron: "17 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Refresh data, report and README
        run: python -m stocklab update
      - name: Commit the refreshed results
        # Commits are authored as the account that owns this workflow (the person who last
        # edited it), so the repository keeps a single contributor and no bot account appears.
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add README.md reports
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Daily refresh: data through $(python -c "import pandas as pd; print(pd.read_csv('reports/board.csv')['as_of'].max())")"
          git pull --rebase
          git push
